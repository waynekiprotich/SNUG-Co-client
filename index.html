<!doctype html>
<html lang="en-KE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf6f0" />
    <script>
      // The cream theme is the default; dark only when chosen with the header toggle.
      try {
        var t = localStorage.getItem('snug-theme-choice') === 'dark' ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#241a12')
      } catch (e) {}
    </script>
    <title>Snug &amp; Co. | Loungewear, Tracksuits &amp; Matchday Wear in Nairobi, Kenya</title>
    <meta name="description" content="Shop Snug &amp; Co., a Nairobi clothing brand: lounge sets, tracksuits, hoodies, jackets and matchday wear. Comfortable, minimal fashion in Kenya. Order on WhatsApp." />
    <meta property="og:site_name" content="Snug & Co." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Snug &amp; Co. | Loungewear, Tracksuits &amp; Matchday Wear in Nairobi, Kenya" />
    <meta property="og:description" content="Where comfort meets elevated living. Lounge sets, tracksuits and matchday pieces from Nairobi." />
    <meta property="og:image" content="/og-default.jpg" />
    <meta property="og:locale" content="en_KE" />
    <meta name="keywords" content="Snug and Co, Snug & Co Kenya, clothing brand Nairobi, loungewear Kenya, lounge sets Nairobi, tracksuits Kenya, hoodies Nairobi, jackets Kenya, matchday jerseys Kenya, Kenya bomber jacket, comfortable clothing Kenya, Kenyan fashion brand, buy clothes online Kenya, streetwear Nairobi" />
    <meta name="geo.region" content="KE-30" />
    <meta name="geo.placename" content="Nairobi" />
    <meta name="google-site-verification" content="%VITE_GOOGLE_SITE_VERIFICATION%" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Start this page's own data (and, on a repeat visit, the hero photo) while the app downloads.
      // Keep the URLs in step with src/lib/catalog.js. Not needed on admin.
      ;(function () {
        var api = '%VITE_API_URL%'.replace(/\/$/, '')
        var path = location.pathname.replace(/\/$/, '') || '/'
        if (!/^(\/|https?:)/.test(api) || path.indexOf('/admin') === 0) return
        function preload(attrs) {
          var link = document.createElement('link')
          link.rel = 'preload'
          for (var key in attrs) link.setAttribute(key, attrs[key])
          document.head.appendChild(link)
        }
        var urls = [api + '/settings']
        var product = path.match(/^\/product\/([^/]+)$/)
        if (path === '/') urls.push(api + '/home')
        else if (product) urls.push(api + '/products/' + product[1])
        else if (/^\/(shop|cart|wishlist)(\/|$)/.test(path)) urls.push(api + '/products')
        urls.forEach(function (href) {
          preload({ as: 'fetch', crossorigin: 'anonymous', href: href })
        })
        if (path === '/') {
          try {
            var hero = JSON.parse(localStorage.getItem('snug-hero'))
            if (hero) preload({ as: 'image', href: hero.src, imagesrcset: hero.srcset, imagesizes: hero.sizes, fetchpriority: 'high' })
          } catch (e) {}
        }
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Product photos come from Cloudinary: connect early so the hero photo isn't held up. -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,300..800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p class="p-8">
        Snug &amp; Co. needs JavaScript to show the collection. You can also find us on Instagram at
        <a href="https://www.instagram.com/snug_co_ke/">@snug_co_ke</a>.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
